# use vi keys in search mode
set-window-option -g mode-keys vi
set -g copy-mode-line-numbers hybrid
set -g copy-mode-line-number-style "fg=colour8"
set -g copy-mode-current-line-number-style "fg=colour15,bold"
# highlight the cursor line itself (tmux 3.8)
set -g copy-mode-current-line-style "bg=colour8"
# emacs key bindings in tmux command prompt (prefix + :) are better than
set -g status-keys emacs

set -g history-limit 50000
set -g display-time 4000

# status bar
set-option -g status-left " #S "
set-option -g status-right "#[default italics]%-l:%M"
set-option -g set-titles on
set-option -g set-titles-string "tmux: #I #W"

# window status (tab selected/unselected)
set-window-option -g window-status-current-format "#[fg=colour7] ■ #I:#W#{?window_zoomed_flag, 󰊓,}"
set-window-option -g window-status-format " □ #I:#W"
set-window-option -g window-status-current-style fg="colour15"
set -g status-position "top"
set -g status-style bg="default",fg="colour15",dim
# messages & command prompt: same lifted colour8 surface as the workmux
# clue menu (menu-style), default fg so light/dark follows the terminal
set -g message-style bg="colour8",fg="default"
set -g message-command-style bg="colour8",fg="default"
set -g message-format "#[align=centre]  #{message} "
# visible cursor against the colour8 prompt surface
set -g prompt-cursor-style blinking-block
set -g prompt-cursor-colour colour15
set -g pane-active-border-style fg="colour8"
set -g pane-border-style fg="colour8"
# dim inactive window text
set -g window-style fg=colour15,dim
set -g window-active-style fg=colour7

# popups/menus (tmux 3.6+ defaults to its own theme colors instead of
# the terminal's) — use the terminal (zenbones) palette instead
# NOTE: use fg=default so text follows the active light/dark terminal theme.
# Keep popup bg=default — apps inside popups (fzf/sesh) detect dark mode and
# pick colors for the dark background; menus are tmux-drawn so they can
# safely use a lifted colour8 surface
set -g popup-style bg=default,fg=default
set -g popup-border-style bg=default,fg=default
set -g popup-border-lines rounded
set -g menu-style bg=colour8,fg=default
set -g menu-selected-style reverse
set -g menu-border-style bg=colour8,fg=default
set -g mode-style reverse

# refresh 'status-left' and 'status-right' more often
set -g status-interval 5

# tmux 3.8: OSC 133 shell-integration events. Notify when a command
# finishes in a window that isn't active (needs OSC 133 emitted by the
# shell — ghostty shell integration / fish 4 provide this)
set-hook -g pane-command-finished 'if -F "#{?window_active,0,1}" "display-message -d 4000 \"#{hook_session_name}: command finished in #{window_name}\""'

# tmux 3.8: auto-hiding scrollbars — appear while scrolling/hovered,
# don't narrow or reflow the pane like the old modal behaviour
set -g pane-scrollbars auto-hide
set -g pane-scrollbars-style fg="themelightgrey"

# terminal compatibility settings
set extended-keys on # allows for meta, ctrl, opt keys, etc.
set extended-keys-format csi-u # matches ghostty
set -g allow-passthrough on
set -g focus-events on
setw -g aggressive-resize on
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0
set -ag terminal-overrides ',*:cud1=\E[1B' # redraw?

# Binds
bind-key C-j join-pane

